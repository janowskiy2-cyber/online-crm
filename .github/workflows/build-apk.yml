name: Build & Sign Android Gateway APK

on:
  push:
    paths:
      - 'android-gateway/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q gradle-8.5-bin.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Release Signing Key
        run: |
          mkdir -p android-gateway/app
          keytool -genkeypair -v \
            -keystore android-gateway/app/release.keystore \
            -alias crmkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "onlinecrm123" \
            -keypass "onlinecrm123" \
            -dname "CN=OnlineCRM, OU=Mobile, O=CRMPro, L=Kyiv, ST=Kyiv, C=UA"

      - name: Build Release APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android-gateway
          sudo chmod +x /opt/gradle-8.5/bin/gradle
          /opt/gradle-8.5/bin/gradle assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          find android-gateway/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/OnlineCRM-Gateway.apk \;
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnlineCRM-Gateway-Signed-APK
          path: build-output/OnlineCRM-Gateway.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: gateway-latest
          name: OnlineCRM Android Gateway (Signed APK)
          body: |
            ## 📱 OnlineCRM Android GSM Gateway
            Автономний Android-шлюз для фіксації дзвінків з фізичних SIM-карт.
            - Цифровий підпис для безпечного встановлення без блокування Google Play Protect.
            - Вхід за логіном і паролем співробітника.
            - Підтримка Dual-SIM (вибір робочої картки).
            - Всплывающий Caller ID оверлей при дзвінках.
          files: build-output/OnlineCRM-Gateway.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
